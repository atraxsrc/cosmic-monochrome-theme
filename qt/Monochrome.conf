# Monochrome colour scheme for qt5ct / qt6ct, part of cosmic-monochrome-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Monochrome, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#bdbdbd, #1c1c1c, #484848, #393939, #111111, #2a2a2a, #bdbdbd, #dddddd, #bdbdbd, #111111, #111111, #111111, #aaaaaa, #111111, #aaaaaa, #aaaaaa, #1c1c1c, #111111, #1c1c1c, #bdbdbd, #828282
disabled_colors=#636363, #1c1c1c, #484848, #393939, #111111, #2a2a2a, #636363, #a7a7a7, #636363, #111111, #111111, #111111, #484848, #a7a7a7, #828282, #828282, #1c1c1c, #111111, #1c1c1c, #bdbdbd, #484848
inactive_colors=#bdbdbd, #1c1c1c, #484848, #393939, #111111, #2a2a2a, #bdbdbd, #dddddd, #bdbdbd, #111111, #111111, #111111, #aaaaaa, #111111, #aaaaaa, #aaaaaa, #1c1c1c, #111111, #1c1c1c, #bdbdbd, #828282
