# Monochrome for lazygit, part of cosmic-monochrome-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/monochrome.yml and
# zsh/monochrome.zsh sets LG_CONFIG_FILE to "config.yml,monochrome.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/monochrome.yml"
gui:
  theme:
    activeBorderColor:
      - "#AAAAAA"
      - bold
    inactiveBorderColor:
      - "#484848"
    searchingActiveBorderColor:
      - "#AAAAAA"
      - bold
    optionsTextColor:
      - "#A7A7A7"
    selectedLineBgColor:
      - "#2A2A2A"
    inactiveViewSelectedLineBgColor:
      - "#1C1C1C"
    cherryPickedCommitFgColor:
      - "#111111"
    cherryPickedCommitBgColor:
      - "#CCCCCC"
    markedBaseCommitFgColor:
      - "#111111"
    markedBaseCommitBgColor:
      - "#CCCCCC"
    unstagedChangesColor:
      - "#DDDDDD"
    defaultFgColor:
      - "#BDBDBD"
  authorColors:
    "*": "#CCCCCC"
