# Monochrome for kitty, part of cosmic-monochrome-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Monochrome.conf

foreground              #BDBDBD
background              #111111
selection_foreground    none
selection_background    #393939

cursor                  #AAAAAA
cursor_text_color       #111111

url_color               #CCCCCC
url_style               curly

active_border_color     #AAAAAA
inactive_border_color   #484848
bell_border_color       #AAAAAA

active_tab_foreground   #111111
active_tab_background   #AAAAAA
inactive_tab_foreground #A7A7A7
inactive_tab_background #1C1C1C
tab_bar_background      #111111

mark1_foreground        #111111
mark1_background        #CCCCCC
mark2_foreground        #111111
mark2_background        #CCCCCC
mark3_foreground        #111111
mark3_background        #AAAAAA

# black
color0  #111111
color8  #484848
# red
color1  #DDDDDD
color9  #EEEEEE
# green
